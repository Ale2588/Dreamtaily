<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamTaily — Render test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f7f0e5;color:#3d2b1f;margin:0;padding:32px}
.wrap{max-width:820px;margin:auto}
.card{background:#fffdf8;border:1px solid #eadfce;border-radius:22px;padding:24px;box-shadow:0 16px 40px rgba(61,43,31,.08)}
h1{margin-top:0}.muted{color:#806f61}.book{border:1px solid #eadfce;border-radius:16px;padding:16px;margin:12px 0;background:white}
.book strong{display:block;margin-bottom:6px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}
.primary{background:#df684f;color:white}.secondary{background:#e4f0ef;color:#356f70}.btn:disabled{opacity:.55;cursor:wait}
.status{margin-top:18px;padding:14px;border-radius:12px;background:#f0eee8;white-space:pre-wrap}.ok{background:#e6f3eb}.bad{background:#fdeae5;color:#9d3a28}
.pages{margin-top:16px}.page{font-size:13px;padding:8px 0;border-bottom:1px solid #eee}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>DreamTaily — Genera libro finale</h1>
    <p class="muted">Pagina tecnica temporanea. Usa la stessa sessione Supabase di DreamTaily e genera il libro completo tramite <code>render-book</code>.</p>
    <div id="session" class="status">Controllo sessione…</div>
    <div class="row"><button id="reload" class="btn secondary">Ricarica libri</button></div>
    <div id="books"></div>
    <div id="result" class="status" hidden></div>
    <div id="pages" class="pages"></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://hirzbtruxvjzmcnncvmv.supabase.co';
const SUPABASE_KEY='sb_publishable_baZvlGyMLBkkiOwHina6CA_HB59Lclw';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const sessionEl=document.getElementById('session');
const booksEl=document.getElementById('books');
const resultEl=document.getElementById('result');
const pagesEl=document.getElementById('pages');
document.getElementById('reload').onclick=loadBooks;

function showResult(text,type=''){
  resultEl.hidden=false;
  resultEl.className='status '+type;
  resultEl.textContent=text;
}

async function getSession(){
  const {data,error}=await sb.auth.getSession();
  if(error) throw error;
  return data.session;
}

async function loadBooks(){
  booksEl.innerHTML='';
  pagesEl.innerHTML='';
  resultEl.hidden=true;

  const session=await getSession();
  if(!session){
    sessionEl.className='status bad';
    sessionEl.textContent='Nessuna sessione DreamTaily trovata. Apri prima DreamTaily nello stesso dominio, poi torna qui.';
    return;
  }

  sessionEl.className='status ok';
  sessionEl.textContent='Sessione trovata. Carico i libri…';

  const {data:books,error}=await sb
    .from('books')
    .select('id,title,status,updated_at,book_stories(id,story_slug,path_choices,status)')
    .order('updated_at',{ascending:false});

  if(error) throw error;

  sessionEl.textContent=`Sessione OK — ${books?.length||0} libri trovati.`;

  if(!books?.length){
    booksEl.innerHTML='<p>Nessun libro trovato.</p>';
    return;
  }

  for(const book of books){
    const story=book.book_stories?.[0];
    const div=document.createElement('div');
    div.className='book';
    div.innerHTML=`
      <strong>${escapeHtml(book.title||'Libro senza titolo')}</strong>
      <div class="muted">${escapeHtml(story?.story_slug||'nessuna storia')} · ${escapeHtml(book.status||'')}</div>
      <div class="muted">${escapeHtml(JSON.stringify(story?.path_choices||{}))}</div>
      <div class="row"><button class="btn primary">Genera libro finale</button></div>`;
    div.querySelector('button').onclick=()=>generateBook(book.id,div.querySelector('button'));
    booksEl.appendChild(div);
  }
}

async function generateBook(bookId,button){
  button.disabled=true;
  pagesEl.innerHTML='';

  try{
    const session=await getSession();
    if(!session) throw new Error('SESSION_MISSING');

    let key=localStorage.getItem(`dreamtaily-render-key:${bookId}`);
    if(!key){
      key=`manual-test-${crypto.randomUUID()}`;
      localStorage.setItem(`dreamtaily-render-key:${bookId}`,key);
    }

    showResult('Render avviato. Può richiedere alcuni minuti…');

    const response=await fetch(`${SUPABASE_URL}/functions/v1/render-book`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPABASE_KEY,
        'Authorization':`Bearer ${session.access_token}`
      },
      body:JSON.stringify({book_id:bookId,idempotency_key:key})
    });

    const payload=await response.json().catch(()=>({error:`HTTP_${response.status}`}));
    if(!response.ok) throw new Error(payload.error||`HTTP_${response.status}`);

    renderPayload(payload);
  }catch(error){
    showResult(`Errore: ${error.message||error}`,'bad');
  }finally{
    button.disabled=false;
  }
}

function renderPayload(payload){
  const ok=payload.status==='ready';

  showResult(
    `Render ID: ${payload.render_id||'—'}\n`+
    `Stato: ${payload.status||'—'}\n`+
    `Permalink slug: ${payload.permalink_slug||'—'}\n`+
    `Idempotente: ${payload.idempotent?'sì':'no'}`,
    ok?'ok':''
  );

  const pages=payload.pages||[];
  pagesEl.innerHTML=pages.map(p=>`
    <div class="page">
      <strong>${escapeHtml(p.page_id||'')}</strong>
      — ${escapeHtml(p.render?.status||'')}
      · tentativi ${p.render?.attempts??0}
      ${p.render?.error?` · ${escapeHtml(p.render.error)}`:''}
    </div>`).join('');
}

function escapeHtml(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

loadBooks().catch(error=>{
  sessionEl.className='status bad';
  sessionEl.textContent=`Errore iniziale: ${error.message||error}`;
});
</script>
</body>
</html>
