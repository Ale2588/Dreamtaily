<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamTaily — La tua storia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lora:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#FDF8F0;--coral:#E8735A;--coral-deep:#C9543C;--teal:#5B9EA0;
  --gold:#F2C14E;--brown:#3D2B1F;--warm-gray:#8C7B6B;--line:#EFE5D3;
}
html,body{min-height:100%;background:#EFE7DA;font-family:'Nunito',sans-serif;color:var(--brown);}

@keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.018);}}
@keyframes pageIn{0%{opacity:0;transform:translateX(24px);}100%{opacity:1;transform:translateX(0);}}
@keyframes pageInBack{0%{opacity:0;transform:translateX(-24px);}100%{opacity:1;transform:translateX(0);}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

.wrap{max-width:560px;margin:0 auto;padding:18px 14px 90px;}

.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;}
.brand-mark{width:26px;height:26px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;}
.brand-diamond{width:11px;height:11px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:var(--gold);}
.brand-text{font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;}
.brand-text span{color:var(--coral);}

.page{
  background:#FFFDF8;border:1px solid #EFE3CC;border-radius:20px;
  padding:30px 24px 26px;box-shadow:0 12px 34px rgba(61,43,31,.1);
  min-height:70vh;display:flex;flex-direction:column;
  animation:pageIn .45s ease;
}
.page.back{animation:pageInBack .45s ease;}

.chapter-label{
  font-family:'Baloo 2',cursive;font-weight:700;font-size:12px;
  letter-spacing:.5px;text-transform:uppercase;color:var(--coral-deep);
  text-align:center;margin-bottom:16px;
}
.page-illu{
  width:100%;border-radius:14px;overflow:hidden;background:#F4ECDD;
  aspect-ratio:16/10;margin-bottom:18px;
}
.page-illu img{width:100%;height:100%;object-fit:cover;display:block;}
.page-companion{text-align:center;margin:6px 0 16px;}
.page-companion img{height:150px;object-fit:contain;animation:breathe 5s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 8px 12px rgba(61,43,31,.15));}
.page-text{
  font-family:'Lora',serif;font-size:17px;line-height:1.9;
  white-space:pre-line;flex:1;
}
.page-text::first-letter{
  font-family:'Baloo 2',cursive;font-size:2.4em;color:var(--coral);
  float:left;line-height:.9;padding-right:7px;padding-top:2px;
}
.pagenum{text-align:center;font-family:'Lora',serif;font-style:italic;font-size:12px;color:#B7A88F;margin-top:16px;}

/* COVER */
.cover{text-align:center;justify-content:center;position:relative;overflow:hidden;}
.cover-style{display:inline-block;padding:5px 14px;border-radius:20px;background:#FBE9E3;color:var(--coral-deep);font-weight:800;font-size:11.5px;margin-bottom:18px;}
.cover-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1.12;margin-bottom:6px;}
.cover-title span{color:var(--coral);}
.cover-sub{font-family:'Lora',serif;font-style:italic;font-size:15px;color:var(--warm-gray);margin-bottom:20px;}
.cover-illu{width:100%;border-radius:16px;overflow:hidden;aspect-ratio:1/1;background:#F4ECDD;margin-bottom:8px;}
.cover-illu img{width:100%;height:100%;object-fit:cover;}
.star{position:absolute;color:var(--gold);animation:twinkle 2.8s ease-in-out infinite;}

/* END */
.end{text-align:center;justify-content:center;}
.end-word{font-family:'Baloo 2',cursive;font-weight:800;font-size:34px;color:var(--coral);margin-bottom:10px;}
.end-note{font-family:'Lora',serif;font-style:italic;font-size:15px;color:var(--warm-gray);margin-bottom:26px;}
.btn-print{
  display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);
  background:#fff;border-radius:13px;padding:12px 20px;font-weight:800;
  font-size:14px;color:var(--brown);cursor:pointer;font-family:inherit;
}

/* NAV */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(247,241,231,.94);backdrop-filter:blur(10px);
  border-top:1px solid #E6DAC6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.nav-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px;}
.nav-btn{
  border:none;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;
  cursor:pointer;font-family:inherit;background:#fff;border:2px solid var(--line);color:var(--brown);
}
.nav-btn.primary{background:linear-gradient(180deg,#EC8068,#E8735A);color:#fff;border:none;box-shadow:0 8px 18px rgba(232,115,90,.3);}
.nav-btn:disabled{opacity:.4;cursor:default;}
.dots{flex:1;display:flex;justify-content:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:#E2D6C2;transition:all .25s;}
.dot.on{background:var(--coral);transform:scale(1.25);}

/* STATES */
.state{max-width:420px;margin:80px auto;text-align:center;padding:0 20px;}
.state-emoji{font-size:44px;margin-bottom:14px;}
.state-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:22px;margin-bottom:8px;}
.state-body{font-size:15px;color:var(--warm-gray);line-height:1.6;}

/* PRINT */
@media print{
  body{background:#fff;}
  .nav,.brand{display:none;}
  .wrap{max-width:100%;padding:0;}
  .page{display:flex !important;page-break-after:always;box-shadow:none;border:none;min-height:auto;animation:none;}
  .page[hidden]{display:flex !important;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark"><div class="brand-diamond"></div></div>
    <span class="brand-text">Dream<span>Taily</span></span>
  </div>
  <div id="book"></div>
</div>

<div class="nav" id="nav" style="display:none;">
  <div class="nav-inner">
    <button class="nav-btn" id="btn-prev" onclick="go(-1)">←</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn primary" id="btn-next" onclick="go(1)">Avanti →</button>
  </div>
</div>

<script>
// ── CONFIG — stessa chiave di index.html ──
const SUPABASE_URL = 'https://hirzbtruxvjzmcnncvmv.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE'; // ← incolla la stessa anon key di index.html

const SPECIES = {rabbit:'il Coniglietto',bear:'l\'Orsacchiotto',fox:'la Volpetta',owl:'il Gufetto',frog:'il Ranocchio',eagle:'l\'Aquilotto',hedgehog:'il Riccetto',mouse:'il Topolino'};
const NAMES   = {rabbit:'Etto',bear:'Rubens',fox:'Fiamma',owl:'Ulivo',frog:'Salto',eagle:'Vento',hedgehog:'Pinto',mouse:'Briciola'};
const STYLE_NAMES = {paper:'Paper Cut',water:'Acquerello',crayon:'Pastelli'};

let book = null;
let slides = [];
let cur = 0;
let lastDir = 1;

function showState(emoji, title, body){
  document.getElementById('book').innerHTML =
    `<div class="state"><div class="state-emoji">${emoji}</div>
     <div class="state-title">${title}</div><div class="state-body">${body}</div></div>`;
}

async function load(){
  const id = new URLSearchParams(location.search).get('id');
  if(!id || !/^[0-9a-f-]{36}$/i.test(id)){
    showState('🔍','Libro non trovato','Controlla il link che hai ricevuto via email.');
    return;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/books?id=eq.${id}&select=*`,{
      headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`}
    });
    const rows = await res.json();
    if(!Array.isArray(rows) || rows.length===0){
      showState('🌙','Questo libro non è ancora pronto','Ci stiamo lavorando con cura. Riceverai una email appena la storia sarà completa.');
      return;
    }
    book = rows[0];
    buildSlides();
    render();
    document.getElementById('nav').style.display='block';
  }catch(e){
    console.error(e);
    showState('☁️','Qualcosa è andato storto','Riprova tra un momento.');
  }
}

function buildSlides(){
  const compName = NAMES[book.companion_id] || 'il suo amico';
  const compSpec = SPECIES[book.companion_id] || '';
  const coverImg = book.cover_url
    ? `<div class="cover-illu"><img src="${book.cover_url}" alt=""></div>`
    : `<div class="page-companion"><img src="assets/char/${book.style}/${book.companion_id}.png" alt=""></div>`;

  slides = [];

  // COVER
  slides.push(`
    <div class="page cover">
      <span class="star" style="top:8%;left:10%;font-size:16px;">✦</span>
      <span class="star" style="top:14%;right:12%;font-size:11px;animation-delay:.6s;">✦</span>
      <span class="star" style="bottom:18%;left:14%;font-size:10px;animation-delay:1.1s;">✦</span>
      <div><span class="cover-style">${STYLE_NAMES[book.style]||''}</span></div>
      <div class="cover-title">La storia di<br><span>${esc(book.child_name)}</span></div>
      <div class="cover-sub">con ${compName} ${compSpec}</div>
      ${coverImg}
    </div>`);

  // CHAPTERS
  (book.pages||[]).forEach((p,i)=>{
    const illu = p.image_url
      ? `<div class="page-illu"><img src="${p.image_url}" alt=""></div>`
      : (i===0 && !book.cover_url ? '' :
         (i===0 ? `<div class="page-companion"><img src="assets/char/${book.style}/${book.companion_id}.png" alt=""></div>` : ''));
    slides.push(`
      <div class="page">
        <div class="chapter-label">Capitolo ${p.chapter||i+1} — ${esc(p.station||'')}</div>
        ${illu}
        <div class="page-text">${esc(p.text||'')}</div>
        <div class="pagenum">— ${i+1} —</div>
      </div>`);
  });

  // END
  slides.push(`
    <div class="page end">
      <div class="end-word">Fine ✨</div>
      <div class="end-note">Questa storia appartiene a ${esc(book.child_name)}.<br>Può rileggerla tutte le volte che vuole.</div>
      <div><button class="btn-print" onclick="window.print()">🖨 Scarica per stampare</button></div>
    </div>`);
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const host = document.getElementById('book');
  host.innerHTML = slides[cur];
  if(lastDir<0) host.firstElementChild.classList.add('back');
  document.getElementById('btn-prev').disabled = cur===0;
  const next = document.getElementById('btn-next');
  next.textContent = cur===slides.length-1 ? '✓' : 'Avanti →';
  next.disabled = cur===slides.length-1;
  document.getElementById('dots').innerHTML =
    slides.map((_,i)=>`<div class="dot ${i===cur?'on':''}"></div>`).join('');
  window.scrollTo(0,0);
}

function go(d){
  const n = cur+d;
  if(n<0||n>=slides.length) return;
  lastDir=d; cur=n; render();
}

// keyboard + swipe
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55) go(dx<0?1:-1);
  tx=null;
},{passive:true});

load();
</script>
</body>
</html>
