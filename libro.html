<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamTaily — Il tuo libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--cream:#f8f0e4;--paper:#fffdf8;--coral:#e66850;--brown:#3a281d;--muted:#877466;--line:#eadbc5}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--brown);font-family:Nunito,system-ui,sans-serif}
body{padding:14px 14px 92px}
.shell{width:min(1180px,100%);margin:0 auto}
.brand{display:flex;justify-content:center;align-items:center;gap:8px;margin:4px 0 14px;font-family:"Baloo 2",sans-serif;font-size:20px;font-weight:800;color:inherit;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fff}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 42px rgba(58,40,29,.10);overflow:hidden}
.layout-card{width:100%;background:var(--paper)}
.spread{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);min-height:calc(100vh - 150px)}
.visual{background:#eee5d8;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual img{width:100%;height:100%;object-fit:cover;display:block}
.copy{padding:30px clamp(24px,4vw,48px);overflow:auto;max-height:calc(100vh - 150px);align-self:stretch}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;color:var(--coral);font-weight:800;font-size:12px;margin-bottom:8px}
h1,h2{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.1}
h1{font-size:clamp(34px,5vw,58px)} h2{font-size:clamp(27px,3vw,38px)}
.subtitle{font-family:Lora,serif;font-style:italic;color:var(--muted);font-size:17px;margin-top:10px}
.story{font-family:Lora,serif;font-size:18px;line-height:1.72;white-space:pre-line;margin-top:20px}
.page-number{text-align:center;color:#b09b88;font-family:Lora,serif;font-style:italic;margin-top:22px}
.cover .copy{display:flex;flex-direction:column;justify-content:center;text-align:center}
.cover .eyebrow{text-align:center}
.state{padding:70px 28px;text-align:center}
.state h2{font-family:"Baloo 2";font-size:30px;margin:0 0 10px}
.state p{color:var(--muted);line-height:1.6}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(248,240,228,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
.nav-in{width:min(1180px,100%);margin:auto;display:flex;align-items:center;gap:12px}
button{font:800 14px Nunito,sans-serif;border-radius:13px;padding:12px 18px;border:2px solid var(--line);background:#fff;color:var(--brown);cursor:pointer}
button.primary{background:var(--coral);border-color:var(--coral);color:#fff}
button:disabled{opacity:.35;cursor:default}
.count{flex:1;text-align:center;color:var(--muted);font-size:13px;font-weight:800}
.end{text-align:center;padding:74px 26px}.end .big{font:800 44px "Baloo 2",sans-serif;color:var(--coral)}.end p{font-family:Lora,serif;color:var(--muted);line-height:1.7}
#print-book{display:none}
.pdf-export-root{position:fixed;left:-100000px;top:0;width:1240px;background:#fff;pointer-events:none}
.pdf-export-root .print-book-spread{position:relative;width:1240px;height:465px;background:#fff;overflow:hidden}
.pdf-export-root .print-full-spread .layout-card,.pdf-export-root .print-full-spread .dtb-doppia{width:1240px!important;height:465px!important;max-width:none!important;margin:0!important}
.pdf-export-root .print-story-title{display:grid;grid-template-columns:620px 620px}
.pdf-export-root .print-story-title .print-cover-front,.pdf-export-root .print-story-title .layout-card,.pdf-export-root .print-story-title .dtc-cover{width:620px!important;height:465px!important;max-width:none!important;margin:0!important}
.pdf-export-root .print-cover-sheet{display:grid;grid-template-columns:620px 620px;background:#fdf8f0}
.pdf-export-root .print-cover-back{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px;color:#22321f;text-align:center;font-family:Faustina,Georgia,serif}
.pdf-export-root .print-cover-back img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff}
.pdf-export-root .print-cover-back strong{font-size:38px}.pdf-export-root .print-cover-back p{font-size:21px;line-height:1.5;max-width:390px}
.pdf-export-root .print-cover-front,.pdf-export-root .print-cover-front .layout-card,.pdf-export-root .print-cover-front .dtc-cover{width:620px!important;height:465px!important;max-width:none!important;margin:0!important}
@media(max-width:780px){
  body{padding:8px 8px 86px}.card{border-radius:18px}.spread{display:block;min-height:0}
  .visual{min-height:0;aspect-ratio:4/3}.copy{max-height:none;padding:24px 21px 30px}.story{font-size:17px;line-height:1.75}
}
@media print{
  html,body{background:#fff!important;padding:0!important}
  .brand,#book,.nav{display:none!important}
  #print-book{display:block!important}
  .print-book-spread{position:relative;width:480mm;height:180mm;background:#fff;overflow:hidden;page-break-after:always;break-after:page}
  .print-book-spread:last-child{page-break-after:auto;break-after:auto}
  .print-book-spread .card{border:0;border-radius:0;box-shadow:none;margin:0}
  .print-full-spread .layout-card,.print-full-spread .dtb-doppia{width:480mm!important;height:180mm!important;max-width:none!important;margin:0!important}
  .print-story-title{display:grid;grid-template-columns:240mm 240mm}
  .print-story-title .print-cover-front,.print-story-title .layout-card,.print-story-title .dtc-cover{width:240mm!important;height:180mm!important;max-width:none!important;margin:0!important}
  .print-cover-sheet{display:grid;grid-template-columns:240mm 240mm;background:#fdf8f0}
  .print-cover-back{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5mm;padding:22mm;color:#22321f;text-align:center;font-family:Faustina,Georgia,serif}
  .print-cover-back img{width:22mm;height:22mm;border-radius:50%;object-fit:cover;background:#fff}
  .print-cover-back strong{font-size:22pt}.print-cover-back p{font-size:12pt;line-height:1.5;max-width:150mm}
  .print-cover-front,.print-cover-front .layout-card,.print-cover-front .dtc-cover{width:240mm!important;height:180mm!important;max-width:none!important;margin:0!important}
}
</style>
</head>
<body>
<div class="shell">
  <a class="brand" href="index.html"><img src="assets/brand/dreamtaily-icon.png" alt=""><span>Dream<span style="color:var(--coral)">Taily</span></span></a>
  <main id="book"><div class="card state"><h2>Carico il tuo libro…</h2><p>Un momento.</p></div></main>
</div>
<div id="print-book"></div>
<div class="nav" id="nav" hidden>
  <div class="nav-in">
    <button id="prev">← Indietro</button>
    <div class="count" id="count"></div>
    <button id="print">Scarica PDF del libro</button>
    <button class="primary" id="next">Avanti →</button>
  </div>
</div>
<script type="module">
import {caricaGabbie,gabbiaPerNome} from "./src/book/gabbie.js";
import {renderDoppia,stiliDoppia} from "./src/book/doppia.js";
import {inizializzaGabbieCopertina,gabbiaCopertinaPerNome,renderCopertina,stiliCopertina} from "./src/book/cover-layout.js";
import {buildImagePdf} from "./src/book/pdf-export.js";

const DELIVERY_URL="https://hirzbtruxvjzmcnncvmv.supabase.co/functions/v1/deliver-book";
let slides=[], current=0;
let gabbieReady=false;
let coverLayoutsReady=false;
const style=document.createElement("style");style.textContent=stiliDoppia+stiliCopertina;document.head.appendChild(style);
const esc=(value)=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function state(title,body){document.getElementById("nav").hidden=true;document.getElementById("book").innerHTML=`<div class="card state"><h2>${esc(title)}</h2><p>${esc(body)}</p></div>`;}
function spread(page,isCover=false,portraitOverride=null){
  const globalCover=portraitOverride??(page.page_id==="book__cover"||page.format==="portrait");
  if(isCover&&coverLayoutsReady&&page.layout?.gabbia){
    const gabbia=gabbiaCopertinaPerNome(page.layout.gabbia,"front");
    if(gabbia)return `<article class="card layout-card">${renderCopertina({gabbia,image:page.image_url,title:page.title||"",subtitle:page.text||"",brandVariant:page.brand_variant||"dark",portrait:globalCover})}</article>`;
  }
  if(!isCover&&gabbieReady&&page.layout?.gabbia){
    const gabbia=gabbiaPerNome(page.layout.gabbia);
    if(gabbia)return `<article class="card layout-card">${renderDoppia({
      gabbia,
      immagine:page.image_url,
      figura:page.image_url,
      testo:page.text||"",
      specchiata:page.layout.specchiata===true
    })}</article>`;
  }
  return `<article class="card spread ${isCover?"cover":""}"><div class="visual"><img src="${esc(page.image_url)}" alt=""></div><div class="copy"><div class="eyebrow">${isCover?"DreamTaily":`Capitolo ${esc(page.chapter??"")}`}</div>${isCover?`<h1>${esc(page.title||"")}</h1><div class="subtitle">${esc(page.text||"")}</div>`:`<div class="story">${esc(page.text||"")}</div><div class="page-number">— ${esc(page.chapter??"")} —</div>`}</div></article>`;
}
function buildCoverPrint(page){
  if(!page) return "";
  return `<section class="print-book-spread print-cover-sheet"><div class="print-cover-back"><img src="assets/brand/dreamtaily-icon.png" alt=""><strong>DreamTaily</strong><p>Storie illustrate da vivere, scegliere e rileggere insieme.</p></div><div class="print-cover-front">${spread(page,true,false)}</div></section>`;
}
function buildUnifiedPrint(pages){
  const sheets=[];
  const globalCover=pages.find(page=>page.page_id==="book__cover");
  if(globalCover) sheets.push(buildCoverPrint(globalCover));
  for(const page of pages.filter(item=>item.page_id!=="book__cover")){
    if(page.kind==="cover") sheets.push(`<section class="print-book-spread print-story-title"><div></div><div class="print-cover-front">${spread(page,true,false)}</div></section>`);
    else sheets.push(`<section class="print-book-spread print-full-spread">${spread(page,false)}</section>`);
  }
  return sheets.join("");
}
function build(book){
  const pages=Array.isArray(book.pages)?book.pages:[];
  slides=[];
  pages.forEach(page=>{
    const isCover=page.kind==="cover";
    slides.push(spread(page,isCover));
  });
  slides.push(`<article class="card end"><div class="big">Fine ✨</div><p>Questa storia appartiene a ${esc(book.protagonist||"te")}.<br>Puoi rileggerla tutte le volte che vuoi.</p><button onclick="printWholeBook()">Scarica PDF del libro</button></article>`);
  window.dtPrintBook=buildUnifiedPrint(pages);
}
function render(){
  document.getElementById("book").innerHTML=slides[current]||"";
  document.getElementById("count").textContent=`${current+1} / ${slides.length}`;
  document.getElementById("prev").disabled=current===0;
  document.getElementById("next").disabled=current===slides.length-1;
  document.getElementById("next").textContent=current===slides.length-1?"✓":"Avanti →";
  window.scrollTo({top:0,behavior:"instant"});
}
function go(delta){const n=current+delta;if(n<0||n>=slides.length)return;current=n;render();}
const EXPORT_WIDTH=5669;
const EXPORT_HEIGHT=2126;
const PDF_WIDTH=1360.63;
const PDF_HEIGHT=510.24;
async function dataUrl(src){
  if(String(src).startsWith("data:"))return src;
  const response=await fetch(src,{cache:"force-cache"});
  if(!response.ok)throw new Error(`PDF_ASSET_HTTP_${response.status}`);
  const blob=await response.blob();
  return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});
}
async function freezeSheet(sheet){
  const clone=sheet.cloneNode(true);
  const originals=[sheet,...sheet.querySelectorAll("*")];
  const copies=[clone,...clone.querySelectorAll("*")];
  for(let index=0;index<originals.length;index+=1){
    const computed=getComputedStyle(originals[index]);
    copies[index].style.cssText=Array.from(computed).map(name=>`${name}:${computed.getPropertyValue(name)};`).join("");
  }
  const originalImages=[...sheet.querySelectorAll("img")];
  const clonedImages=[...clone.querySelectorAll("img")];
  await Promise.all(originalImages.map(async(img,index)=>{clonedImages[index].src=await dataUrl(img.currentSrc||img.src);}));
  clone.setAttribute("xmlns","http://www.w3.org/1999/xhtml");
  return new XMLSerializer().serializeToString(clone);
}
async function sheetJpeg(sheet){
  const markup=await freezeSheet(sheet);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="465" viewBox="0 0 1240 465"><foreignObject width="1240" height="465">${markup}</foreignObject></svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
  try{
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url;});
    const canvas=document.createElement("canvas");
    canvas.width=EXPORT_WIDTH;canvas.height=EXPORT_HEIGHT;
    const context=canvas.getContext("2d",{alpha:false});
    context.fillStyle="#ffffff";context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error("PDF_CANVAS_EMPTY")),"image/jpeg",.94));
    return new Uint8Array(await blob.arrayBuffer());
  }finally{URL.revokeObjectURL(url);}
}
async function exportBookPdf(content){
  const button=document.getElementById("print");
  const root=document.createElement("div");root.className="pdf-export-root";root.innerHTML=content;document.body.appendChild(root);
  try{
    button.disabled=true;button.textContent="Preparo il PDF…";
    await document.fonts.ready;
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const sheets=[...root.querySelectorAll(".print-book-spread")];
    if(!sheets.length)throw new Error("PDF_PAGES_EMPTY");
    const jpegs=[];
    for(let index=0;index<sheets.length;index+=1){button.textContent=`Creo pagina ${index+1} di ${sheets.length}…`;jpegs.push(await sheetJpeg(sheets[index]));}
    const pdf=buildImagePdf({jpegs,width:PDF_WIDTH,height:PDF_HEIGHT,imageWidth:EXPORT_WIDTH,imageHeight:EXPORT_HEIGHT});
    const link=document.createElement("a");link.href=URL.createObjectURL(pdf);link.download=`${document.title.replace(/[^a-z0-9à-ž _—-]/gi,"").trim()||"DreamTaily"}.pdf`;link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),30000);
  }catch(error){console.error(error);alert(`Non riesco a preparare il PDF (${error?.message||"errore sconosciuto"}).`);}
  finally{root.remove();button.disabled=false;button.textContent="Scarica PDF del libro";}
}
function printWholeBook(){return exportBookPdf(window.dtPrintBook||"");}
window.printWholeBook=printWholeBook;
async function load(){
  const slug=new URLSearchParams(location.search).get("slug")||"";
  if(!/^[a-f0-9]{48,96}$/i.test(slug)){state("Libro non trovato","Il link non è valido o è incompleto.");return;}
  try{
    const [catalogResponse,coverCatalogResponse]=await Promise.all([fetch("./src/book/gabbie.json",{cache:"no-store"}),fetch("./src/book/gabbie-copertina.json",{cache:"no-store"})]);
    if(catalogResponse.ok){caricaGabbie(await catalogResponse.json());gabbieReady=true;}
    if(coverCatalogResponse.ok){inizializzaGabbieCopertina(await coverCatalogResponse.json());coverLayoutsReady=true;}
    const response=await fetch(`${DELIVERY_URL}?slug=${encodeURIComponent(slug)}&v=3`,{method:"GET",headers:{"Accept":"application/json"},cache:"no-store"});
    const payload=await response.json().catch(()=>null);
    if(response.status===404){state("Libro non trovato","Questo libro non è disponibile.");return;}
    if(!response.ok||!payload)throw new Error(payload?.error||`HTTP_${response.status}`);
    if(!Array.isArray(payload.pages)||!payload.pages.length)throw new Error("BOOK_EMPTY");
    const missing=payload.pages.filter(p=>p.kind!=="cover"&&!String(p.text||"").trim());
    if(missing.length)throw new Error(`BOOK_TEXT_MISSING:${missing.map(p=>p.page_id).join(",")}`);
    build(payload);render();document.getElementById("nav").hidden=false;document.title=`${payload.title||"DreamTaily"} — DreamTaily`;
  }catch(error){console.error(error);state("Qualcosa è andato storto","Ricarica la pagina tra un momento.");}
}
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.getElementById("print").onclick=printWholeBook;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
load();
</script>
</body>
</html>
