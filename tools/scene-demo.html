<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamTaily — Pilota scena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f0e5;color:#3d2b1f;font-family:system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:28px}
h1{margin-bottom:6px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}
button{border:1px solid #d7c8b5;background:#fff;padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer}
button[aria-pressed="true"]{background:#e8735a;color:white;border-color:#e8735a}
.dt-scene-stage{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:24px;background:#ddd;box-shadow:0 18px 50px rgba(61,43,31,.18)}
.dt-scene-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.dt-scene-character{position:absolute;transform:translate(-50%,-100%);width:auto;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(0,0,0,.25))}
pre{white-space:pre-wrap;background:#fff;padding:14px;border-radius:14px;margin-top:18px}
.note{color:#75685c;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Pilota scena deterministica</h1>
  <p class="note">
    Usa le due immagini già presenti nel repository come sfondi verificati.
    Il personaggio demo viene sovrapposto con coordinate relative.
  </p>

  <div class="controls">
    <strong>Atmosfera:</strong>
    <button id="notte" type="button" aria-pressed="true">Notte</button>
    <button id="tramonto" type="button" aria-pressed="false">Tramonto</button>
  </div>

  <div id="scene"></div>
  <pre id="status">Caricamento…</pre>
</main>

<script src="./scene-composer.js"></script>
<script>
let pilot;
let atmosphere="notte";

async function loadPilot(){
  const response=await fetch("../stories/il-bosco-dei-sussurri/scene-pilot/scene-pilot.json",{cache:"no-store"});
  if(!response.ok) throw new Error(`PILOT_HTTP_${response.status}`);
  pilot=await response.json();
  render();
}

function render(){
  const step=pilot.steps.find(item=>item.key==="s1");
  const cast={
    protagonist:{
      name:"Personaggio demo",
      poses:{
        in_piedi:"../assets/char/water/bear.png"
      }
    }
  };
  try{
    const result=DreamTailySceneComposer.renderScene({
      container:document.getElementById("scene"),
      storySlug:pilot.story_slug,
      scene:step.scene,
      choices:{atmosfera:atmosphere},
      cast
    });
    document.getElementById("status").textContent=
      `OK\natmosfera: ${atmosphere}\nsfondo: ${result.background}\nslot dichiarati: ${result.slots}`;
  }catch(error){
    document.getElementById("status").textContent=`ERRORE\n${error.message}`;
  }
}

for(const value of ["notte","tramonto"]){
  document.getElementById(value).addEventListener("click",()=>{
    atmosphere=value;
    for(const key of ["notte","tramonto"]){
      document.getElementById(key).setAttribute("aria-pressed",String(key===value));
    }
    render();
  });
}

loadPilot().catch(error=>{
  document.getElementById("status").textContent=`ERRORE DI CARICAMENTO\n${error.message}`;
});
</script>
</body>
</html>
