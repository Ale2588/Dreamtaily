<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamTaily — Il bosco dei sussurri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS  (derived from the approved Claude Design look)
     ============================================================ */
  :root{
    --cream:#f3ead9;
    --cream-card:#fff8ec;
    --ink:#2e2a24;
    --muted:#6b6152;
    --faint:#a89a7f;
    --teal:#2f7d78;        /* primary accent */
    --coral:#cf6338;       /* hover / protagonist */
    --green:#4f7a45;       /* success / "clean" */
    --line:rgba(46,42,36,0.12);
    --radius:14px;
    --shadow-sm:0 2px 6px rgba(0,0,0,.05);
    --shadow-md:0 8px 20px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--cream);
    background-image:radial-gradient(rgba(46,42,36,.035) 1px,transparent 1px);
    background-size:4px 4px;
    color:var(--ink);
    font-family:'Baloo 2',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  #app{max-width:1040px;margin:0 auto;padding:22px 18px 80px}
  input{font-family:inherit;font-size:15px}
  input:focus{outline:2px solid var(--teal);outline-offset:1px}
  button{font-family:inherit;border:none;cursor:pointer}
  @keyframes floatIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .screen{animation:floatIn .35s ease both}

  /* header + stepper */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:22px}
  .brand .mvp{font-size:11px;font-weight:700;color:var(--faint);background:#e9dcc4;padding:2px 7px;border-radius:6px}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper .st{display:flex;align-items:center;gap:6px}
  .stepper .n{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#e0d3ba;color:var(--faint)}
  .stepper .n.active{background:var(--teal);color:#fff}
  .stepper .n.done{background:var(--green);color:#fff}
  .stepper .lbl{font-size:13px;color:var(--faint);font-weight:500}
  .stepper .lbl.active{color:var(--ink);font-weight:700}
  .stepper .dash{width:16px;height:2px;background:var(--line);margin:0 2px}

  /* layout */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm)}
  h1{font-size:26px;font-weight:800;margin-bottom:4px}
  h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .req{font-size:11px;font-weight:700;color:var(--coral);background:rgba(207,99,56,.12);padding:2px 7px;border-radius:6px}
  .opt{font-size:11px;font-weight:600;color:var(--faint)}
  .tag{font-family:ui-monospace,monospace;font-size:10px;color:var(--faint);background:#e9dcc4;padding:2px 6px;border-radius:5px}
  .sec{margin-top:20px}
  .sec:first-child{margin-top:0}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;
    background:var(--cream);border:2px solid var(--line);box-shadow:var(--shadow-sm);
    font-size:14px;color:var(--ink);text-align:left;transition:all .15s}
  .chip.full{width:100%}
  .chip.sel{background:var(--cream-card);border-color:var(--teal);box-shadow:0 6px 16px rgba(47,125,120,.22)}
  .chip.dis{opacity:.4;cursor:not-allowed}
  .chip.col{flex-direction:column;align-items:flex-start;gap:3px}
  .chip .desc{font-size:12px;color:var(--muted);font-weight:500}
  .sw{width:22px;height:22px;border-radius:7px;border:2px solid var(--cream);box-shadow:0 2px 5px rgba(0,0,0,.2);flex-shrink:0;transform:rotate(-4deg)}
  .sw.sm{width:16px;height:16px;border-radius:5px}
  .atmos-card{position:relative;overflow:hidden;min-width:150px;min-height:72px;padding:0}
  .atmos-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .atmos-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(30,24,18,.68))}
  .atmos-card .atmos-label{position:relative;z-index:2;align-self:flex-end;color:#fff;padding:36px 12px 9px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.45)}
  .atmos-card.sel{box-shadow:0 7px 18px rgba(47,125,120,.28)}
  .stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
  .stage[data-tone="opening"]::after{background:linear-gradient(90deg,rgba(255,248,236,.08),transparent 50%)}
  .stage[data-tone="crossroads"]::after{background:linear-gradient(130deg,rgba(46,42,36,.12),transparent 55%)}
  .stage[data-tone="foliage"]::after{background:linear-gradient(90deg,rgba(53,89,47,.22),transparent 60%)}
  .stage[data-tone="water"]::after{background:linear-gradient(270deg,rgba(45,100,130,.20),transparent 58%)}
  .stage[data-tone="roots"]::after{background:linear-gradient(0deg,rgba(72,47,29,.24),transparent 62%)}
  .stage[data-tone="stones"]::after{background:linear-gradient(0deg,rgba(55,78,90,.20),transparent 65%)}
  .stage[data-tone="clearing"]::after{background:radial-gradient(circle at 50% 42%,rgba(255,248,210,.20),transparent 48%)}
  .stage[data-tone="return"]::after{background:linear-gradient(180deg,transparent,rgba(46,42,36,.16))}
  .stage[data-tone="promise"]::after{background:linear-gradient(180deg,transparent 55%,rgba(30,40,55,.22))}
  .stage[data-tone="celebration"]::after{background:radial-gradient(circle at 55% 52%,rgba(255,215,115,.22),transparent 48%)}

  label.field{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:12px;margin-bottom:5px}
  input.text{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--cream)}
  .locked{opacity:.42;pointer-events:none;filter:saturate(.3)}

  /* preview stage */
  .stage-wrap{position:sticky;top:18px}
  .stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;
    background:#e9dcc4;border:1px solid var(--line);box-shadow:var(--shadow-md)}
  .stage .bgtag{position:absolute;top:8px;left:8px;z-index:5;font-family:ui-monospace,monospace;
    font-size:10px;color:var(--muted);background:rgba(243,234,217,.85);padding:3px 7px;border-radius:6px}
  .wash{position:absolute;inset:0;pointer-events:none}
  .fig{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
  .fig .head{width:62%;aspect-ratio:1;border-radius:50%;border:3px solid var(--cream);box-shadow:0 6px 14px rgba(0,0,0,.22);flex-shrink:0}
  .fig .body{width:100%;flex:1;margin-top:-8%;border-radius:44% 44% 32% 32%/34% 34% 24% 24%;border:3px solid var(--cream);box-shadow:0 10px 18px rgba(0,0,0,.22);filter:brightness(.9)}
  .fig .figtag{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-family:ui-monospace,monospace;
    font-size:10px;white-space:nowrap;color:var(--muted);background:var(--cream);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
  .fig img{height:100%;width:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.22))}

  .preview-cap{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 8px;font-size:12px;color:var(--muted)}
  .previewtext{font-size:15px;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px}
  .notice{margin-top:12px;font-size:12.5px;color:var(--muted);background:rgba(47,125,120,.08);
    border:1px solid rgba(47,125,120,.22);border-radius:12px;padding:10px 12px;line-height:1.45}
  .notice b{color:var(--teal)}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:14px;text-align:center;padding:20px}

  /* buttons */
  .btn{font-weight:700;border-radius:12px;transition:all .15s}
  .btn.primary{padding:12px 22px;background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(47,125,120,.3);font-size:15px}
  .btn.block{display:block;width:100%;margin-top:16px;padding:14px;background:var(--teal);color:#fff;box-shadow:0 8px 20px rgba(47,125,120,.32);font-size:16px}
  .btn.ghost{padding:9px 16px;background:transparent;color:var(--muted);border:2px solid var(--line);font-size:14px}
  .btn:disabled{background:#cdbfa2;color:#fff;box-shadow:none;opacity:.55;cursor:not-allowed}

  /* book */
  .book-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .marker{font-family:ui-monospace,monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px}
  .marker.ok{background:rgba(79,122,69,.14);color:var(--green);border:1px solid rgba(79,122,69,.3)}
  .marker.bad{background:rgba(207,99,56,.18);color:var(--coral);border:1px solid rgba(207,99,56,.4)}
  .chapterlbl{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
  .dot{height:9px;border-radius:5px;background:rgba(46,42,36,.18);cursor:pointer;transition:all .2s;padding:0}
  .navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}

  /* checkout */
  .sumrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .sumrow .k{color:var(--muted)}
  .sumrow .v{font-weight:700}
  .plan{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;border:2px solid var(--line);margin-top:10px;background:var(--cream)}
  .plan.sel{border-color:var(--teal);background:var(--cream-card)}
  .plan.soon{opacity:.55}
  .price{font-size:26px;font-weight:800;color:var(--teal)}
  .perma{display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:13px;margin-top:12px;word-break:break-all}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:.01ms!important;
      scroll-behavior:auto!important;
    }
  }
  .stage.has-real-bg .bgtag{background:rgba(255,248,236,.88)}
  .stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .3s ease}
  .stage.asset-error{background:repeating-linear-gradient(135deg,#eadfc9,#eadfc9 14px,#f4ead8 14px,#f4ead8 28px)}
  .stage.asset-error::before{content:"Asset immagine non trovato";position:absolute;inset:0;display:grid;place-items:center;z-index:4;color:var(--coral);font-weight:800}


  body.dt-embedded #app{max-width:1120px}
  body.dt-embedded .embed-close{display:inline-flex}
  .embed-close{display:none;padding:8px 13px;border-radius:10px;background:var(--cream);color:var(--muted);border:1px solid var(--line);font-weight:800}
  body.dt-embedded .hero-selection{display:none}
  body.dt-embedded .topbar{position:sticky;top:0;z-index:30;background:rgba(243,234,217,.94);padding:10px 0;backdrop-filter:blur(8px)}
</style>
</head>

        {role:"protagonist",pose:"in_piedi",x:.43,y:.95,scale:.38,z:2},
        {role:"helper",pose:"in_piedi",x:.65,y:.94,scale:.28,z:1}
      ]},
      content:{
        base:"Prima di tornare a casa, [Nome], [Aiutante] e gli animali del bosco festeggiano nella radura.",
        variants:{},
        entrance:null
      } },
  ],
};


/* ---------------------- EMBEDDED PRODUCT INTEGRATION ---------------------- */
const DT_EXTERNAL_PROTAGONIST_ID="__dreamtaily_protagonist__";
const DT_EXTERNAL_NAME=DT_EMBED_PARAMS.get("protagonistName")||"";
const DT_EXTERNAL_IMAGE=DT_EMBED_PARAMS.get("protagonistImage")||"";
const DT_BOOK_STORY_ID=DT_EMBED_PARAMS.get("bookStoryId")||"";

if(DT_EMBEDDED&&DT_EXTERNAL_IMAGE){
  STORY.catalog.unshift({
    id:DT_EXTERNAL_PROTAGONIST_ID,
    name:DT_EXTERNAL_NAME||"Il tuo personaggio",
    color:"#cf6338",
    external:true,
    art:{papercut:{
      in_piedi:DT_EXTERNAL_IMAGE,
      cammina:DT_EXTERNAL_IMAGE,
      seduto:DT_EXTERNAL_IMAGE,
      si_china:DT_EXTERNAL_IMAGE,
      di_spalle:DT_EXTERNAL_IMAGE
    }}
  });
}

function notifyDreamTailyParent(){
  if(!DT_EMBEDDED||window.parent===window) return;
  window.parent.postMessage({
    type:"dreamtaily:configurator-state",
    bookStoryId:DT_BOOK_STORY_ID,
    setup:{...S.setup},
    branch:{...S.branch},
    helperId:S.cast.helper||null,
    protagonistName:S.protagName||DT_EXTERNAL_NAME||""
  },location.origin);
}

function closeDreamTailyConfigurator(){
  if(DT_EMBEDDED&&window.parent!==window){
    window.parent.postMessage({
      type:"dreamtaily:configurator-close",
      bookStoryId:DT_BOOK_STORY_ID
    },location.origin);
  }
}

/* --------------------------------- STATE ---------------------------------- */
let S = {
  screen:"configure",       // configure | book | checkout | delivered
  protagonist:DT_EMBEDDED&&DT_EXTERNAL_IMAGE?DT_EXTERNAL_PROTAGONIST_ID:null,
  protagName:DT_EMBEDDED?(DT_EXTERNAL_NAME||"Il tuo personaggio"):"",
  cast:{},                  // role -> characterId  (e.g. { helper:"gufo" })
  style:"papercut",
  setup:{ atmosfera:"tramonto" },
  branch:{},                // branchId -> optionId
  plan:"digital",
  page:0, email:"", copied:false,
};
function set(patch){ Object.assign(S, patch); render(); notifyDreamTailyParent(); }

/* --------------------------- LOOKUP HELPERS ------------------------------- */
const char = id => STORY.catalog.find(c=>c.id===id);
const filled = role => role==="protagonist" ? S.protagonist : S.cast[role];
const roleName = role => { const id=filled(role); return id ? char(id).name : ""; };
const atmos = () => STORY.setup.find(s=>s.id==="atmosfera");
const atmosOpt = () => atmos().options.find(o=>o.id===S.setup.atmosfera);

/* ------------------------- CORE: TEXT RESOLUTION -------------------------- */
/* Order: base -> variant[activeSetup] -> entrances (per role, only if filled)
   -> name tokens ([Nome], [Aiutante], ...). Deterministic, no AI. */
function resolveText(step){
  const at = S.setup.atmosfera;
  let t = (step.content.variants && step.content.variants[at]) || step.content.base;

  // entrance token(s): keyed by cast role, injected only when that role is filled
  const ent = step.content.entrance;
  if (ent){
    const slot = STORY.cast.find(c=>c.role===ent.role);
    const token = "["+slot.entranceToken+"]";
    t = t.split(token).join(filled(ent.role) ? ent.text : "");
  }
  // name tokens for every cast role
  const protagTok = STORY.cast.find(c=>c.role==="protagonist").nameToken;
  t = t.split("["+protagTok+"]").join(S.protagName.trim() || "["+protagTok+"]");
  STORY.cast.filter(c=>c.role!=="protagonist").forEach(c=>{
    t = t.split("["+c.nameToken+"]").join(roleName(c.role));
  });
  return t.replace(/\s+/g," ").trim();
}
const hasRawMarkers = t => /\[[^\]]+\]/.test(t);

/* ---------------------- CORE: SCENE COMPOSITION --------------------------- */
/* bg (+ variantBg per atmosfera) + character layers positioned by x/y/scale/z,
   filtered by whether the referenced cast role is filled, sorted by z. */
function resolveAsset(ref){
  if(!ref) return "";
  if(/^(?:https?:|data:|blob:|\/)/.test(ref)) return ref;
  return `${STORY.assetRoot||""}${ref}`;
}
function buildScene(step){
  const at = S.setup.atmosfera;
  const setupOption = atmos().options.find(o=>o.id===at);
  const bg = step.scene.bgBySetup==="atmosfera"
    ? setupOption.image
    : ((step.scene.variantBg && step.scene.variantBg[at]) || step.scene.bg);
  const frame={
    focus:step.scene.focus||"50% 50%",
    zoom:Number.isFinite(step.scene.zoom)?step.scene.zoom:1,
    tone:step.scene.tone||"default"
  };
  const layers = step.scene.slots
    .filter(s => !!filled(s.role))
    .sort((a,b)=>a.z-b.z)
    .map(s=>{
      const c = char(filled(s.role));
      const artRef = c.art && c.art[S.style] && c.art[S.style][s.pose];
      return { role:s.role, pose:s.pose, color:c.color, art:resolveAsset(artRef), x:s.x, y:s.y, scale:s.scale, z:s.z,
               rot: s.role==="helper" ? 2 : -1.5 };
    });
  return { bg:resolveAsset(bg), wash:setupOption.wash, layers, frame };
}

/* ----------------------- CORE: PAGE ASSEMBLY ------------------------------ */
/* Include ungated steps always; include a gated step only if its branch option
   is the chosen one. Then order by chapter. */
function pages(){
  return STORY.steps
    .filter(st => !st.gate || S.branch[st.gate.branch]===st.gate.option);
}

/* --------------------------- RENDER HELPERS ------------------------------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function figHTML(l, showTag){
  const inner = l.art
    ? `<img src="${esc(l.art)}" alt="${esc(roleName(l.role)||l.role)}"
         onerror="this.remove()">`
    : `<div class="head" style="background:${l.color}"></div><div class="body" style="background:${l.color}"></div>`;
  return `<div class="fig" style="left:${l.x*100}%;top:${l.y*100}%;height:${l.scale*100}%;z-index:${l.z+2};
    transform:translate(-50%,-100%) rotate(${l.rot}deg);aspect-ratio:.52">
    ${inner}${showTag?`<div class="figtag">${l.role} · ${l.pose}</div>`:""}</div>`;
}
function stageHTML(step, showTag){
  const sc = buildScene(step);
  const figs = sc.layers.map(l=>figHTML(l,showTag)).join("");
  return `<div class="stage has-real-bg" data-tone="${esc(sc.frame.tone)}">
    <img class="stage-bg" src="${esc(sc.bg)}" alt=""
      style="object-position:${esc(sc.frame.focus)};transform:scale(${sc.frame.zoom})"
      onerror="this.closest('.stage').classList.add('asset-error');this.remove()">
    <div class="bgtag">scena temporanea · ${esc(step.id)}</div>
    <div class="wash" style="background:${sc.wash};z-index:2"></div>
    ${figs}
  </div>`;
}

/* ------------------------------- SCREENS ---------------------------------- */
function stepperHTML(){
  const order=["configure","book","checkout","delivered"];
  const labels={configure:"Configura",book:"Sfoglia",checkout:"Checkout",delivered:"Consegna"};
  const cur=order.indexOf(S.screen);
  return `<div class="stepper">`+order.map((k,i)=>{
    const active=i===cur, done=i<cur;
    return `<div class="st"><div class="n ${active?"active":done?"done":""}">${done?"✓":i+1}</div>
      <span class="lbl ${active?"active":""}">${labels[k]}</span></div>`+
      (i<order.length-1?`<div class="dash"></div>`:"");
  }).join("")+`</div>`;
}

function selectProtagonist(id,name){
  const nextCast={...S.cast};
  if(nextCast.helper===id) delete nextCast.helper;
  set({
    protagonist:id,
    protagName:S.protagName||name,
    cast:nextCast
  });
}
function getPreviewStep(){
  const path=S.branch.d_sentiero;
  if(path==="felci") return STORY.steps.find(step=>step.id==="s4_felci");
  if(path==="ruscello") return STORY.steps.find(step=>step.id==="s4_ruscello");
  return STORY.steps.find(step=>step.id===STORY.previewStepId);
}

function configureScreen(){
  const hasProtag=!!S.protagonist;
  const locked = hasProtag ? "" : "locked";

  // hero chips
  const heroChips = STORY.catalog.map(c=>`
    <button class="chip full ${S.protagonist===c.id?"sel":""}"
      onclick="selectProtagonist('${c.id}','${c.name}')">
      <span class="sw" style="background:${c.color}"></span>${c.name}</button>`).join("");

  // helper chips, excluding current protagonist
  const helperSlot=STORY.cast.find(c=>c.role==="helper");
  const helperChips = STORY.catalog.filter(c=>c.id!==S.protagonist&&!c.external).map(c=>`
      <button class="chip ${S.cast.helper===c.id?"sel":""}"
        onclick="set({cast:Object.assign({},S.cast,{helper:'${c.id}'})})">
        <span class="sw" style="background:${c.color}"></span>${c.name}</button>`).join("");

  // style chips
  const styleChips = STORY.styles.map(st=>`
    <button class="chip ${S.style===st.id?"sel":""} ${st.active?"":"dis"}"
      ${st.active?`onclick="set({style:'${st.id}'})"`:""}>
      ${st.label}<span class="tag">${st.active?"attivo":"presto"}</span></button>`).join("");

  // atmosfera chips
  const at=atmos();
  const atChips = at.options.map(o=>`
    <button class="chip atmos-card ${S.setup.atmosfera===o.id?"sel":""}"
      onclick="set({setup:Object.assign({},S.setup,{atmosfera:'${o.id}'})})">
      <img src="${esc(resolveAsset(o.image))}" alt="" loading="lazy">
      <span class="atmos-label">${o.label}</span></button>`).join("");

  // branch blocks (one per branch)
  const protagLbl = S.protagName || "il protagonista";
  const branchBlocks = STORY.branches.map(b=>`
    <div class="sec">
      <h2>${b.label}<span class="tag">${b.note}</span></h2>
      <p class="hint" data-branch-prompt="${b.id}">${esc(b.prompt.replace("[protag]",protagLbl))}</p>
      <div class="chips">${b.options.map(o=>`
        <button class="chip full col ${S.branch[b.id]===o.id?"sel":""}"
          onclick="set({branch:Object.assign({},S.branch,{${b.id}:'${o.id}'})})">
          <span>${o.label}</span><span class="desc">${o.desc}</span></button>`).join("")}</div>
    </div>`).join("");

  // preview
  const previewStep = getPreviewStep();
  const previewHTML = hasProtag
    ? `${stageHTML(previewStep,true)}
       <div class="preview-cap"><span>Anteprima composta</span><span>Cap. ${previewStep.chapter} · ${previewStep.title}</span></div>
       <div class="previewtext" id="live-preview-text">${S.cast.helper
         ? esc(resolveText(previewStep))
         : "Scegli un compagno per completare questa pagina."}</div>`
    : `<div class="stage"><div class="empty">Scegli il tuo eroe per vedere l'anteprima del libro.</div></div>`;

  const allBranchesChosen = STORY.branches.every(b=>!!S.branch[b.id]);
  const requiredCastReady=STORY.cast
    .filter(slot=>slot.required&&slot.role!=="protagonist")
    .every(slot=>!!S.cast[slot.role]);
  const canBrowse = hasProtag && requiredCastReady && allBranchesChosen;

  return `<div class="screen">
    <div class="cols">
      <div class="panel">
        <h1>Componi la tua storia</h1>
        <p class="hint">${esc(STORY.title)}</p>

        <div class="sec hero-selection">
          <h2>${STORY.cast[0].label}<span class="req">obbligatorio</span></h2>
          <div class="chips">${heroChips}</div>
          <label class="field">Come si chiama?</label>
          <input class="text" value="${esc(S.protagName)}" placeholder="Il nome del tuo eroe"
            oninput="S.protagName=this.value;updateNameDependentUI()">
        </div>

        <div class="${locked}">
          <div class="sec">
            <h2>${helperSlot.label}<span class="req">obbligatorio</span></h2>
            <div class="chips">${helperChips}</div>
          </div>
          <div class="sec">
            <h2>Lo stile<span class="tag">3 stili</span></h2>
            <div class="chips">${styleChips}</div>
          </div>
          <div class="sec">
            <h2>${at.label}<span class="tag">${at.note}</span></h2>
            <div class="chips">${atChips}</div>
          </div>
          ${branchBlocks}
        </div>
      </div>

      <div class="panel">
        <div class="stage-wrap">
          ${previewHTML}
          <div class="notice"><b>Questa è l'anteprima reale del libro.</b> Nessuna intelligenza artificiale:
            il testo e le illustrazioni che vedi qui sono esattamente ciò che riceverai. Puoi sfogliare
            tutto il libro prima di pagare.</div>
          <button class="btn block" ${canBrowse?"":"disabled"}
            onclick="set({screen:'book',page:0})">Sfoglia il libro →</button>
          <p class="hint" style="text-align:center">${canBrowse
            ? "testo risolto + scene composte, all'istante"
            : "scegli eroe, compagno e completa i bivi per continuare"}</p>
        </div>
      </div>
    </div>
  </div>`;
}

function bookScreen(){
  const pgs=pages();
  const idx=Math.min(S.page,pgs.length-1);
  const step=pgs[idx];
  const text=resolveText(step);
  const clean=!hasRawMarkers(text);
  const dots=pgs.map((p,i)=>`<button class="dot" style="width:${i===idx?22:9}px;background:${i===idx?"var(--teal)":"rgba(46,42,36,.18)"}" onclick="set({page:${i}})"></button>`).join("");
  const last=idx===pgs.length-1;
  return `<div class="screen"><div class="panel" style="max-width:640px;margin:0 auto">
    <div class="book-top">
      <button class="btn ghost" onclick="set({screen:'configure'})">← Modifica</button>
      <span class="chapterlbl">Pagina ${idx+1} di ${pgs.length}</span>
      <span class="marker ${clean?"ok":"bad"}">${clean?"✓ nessun marcatore grezzo":"⚠ marcatore residuo"}</span>
    </div>
    <div class="chapterlbl" style="margin-bottom:6px">Capitolo ${step.chapter}</div>
    <h2 style="font-size:20px;margin-bottom:10px">${esc(step.title)}</h2>
    ${stageHTML(step,false)}
    <p style="margin-top:14px;font-size:16px">${esc(text)}</p>
    <div class="dots">${dots}</div>
    <div class="navrow">
      <button class="btn ghost" style="opacity:${idx===0?.35:1};pointer-events:${idx===0?"none":"auto"}" onclick="set({page:${Math.max(0,idx-1)}})">← Indietro</button>
      ${last
        ? `<button class="btn primary" onclick="set({screen:'checkout'})">Ordina il libro →</button>`
        : `<button class="btn primary" onclick="set({page:${idx+1}})">Avanti →</button>`}
    </div>
  </div></div>`;
}

function checkoutScreen(){
  const pgs=pages();
  const summary=[
    ["Protagonista", S.protagName||"—"],
    ["Compagno", roleName("helper")||"—"],
    ["Stile", STORY.styles.find(s=>s.id===S.style).label],
    ["Atmosfera", atmosOpt().label],
  ].concat(STORY.branches.map(b=>{
    const o=b.options.find(x=>x.id===S.branch[b.id]);
    return [b.label, o?o.label:"—"];
  })).concat([["Pagine", String(pgs.length)]]);

  const emailValid=/\S+@\S+\.\S+/.test(S.email);
  return `<div class="screen"><div class="panel" style="max-width:560px;margin:0 auto">
    <button class="btn ghost" onclick="set({screen:'book'})">← Torna al libro</button>
    <h1 style="margin-top:12px">Il tuo libro</h1>
    <p class="hint">Checkout dimostrativo. Nessun pagamento reale.</p>
    <div style="background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px">
      <div style="font-weight:800;font-size:18px">${esc(STORY.title)}</div>
      <div class="hint">${esc(STORY.subtitle)} ${esc(S.protagName||"—")}</div>
    </div>
    <div style="margin-top:14px">${summary.map(r=>`<div class="sumrow"><span class="k">${r[0]}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div>

    <div class="plan ${S.plan==="digital"?"sel":""}" onclick="set({plan:'digital'})">
      <div><div style="font-weight:800">Libro digitale</div><div class="hint">link permanente · pronto subito</div></div>
      <div class="price">${STORY.price}</div>
    </div>
    <div class="plan soon">
      <div><span style="font-weight:800">Libro stampato e spedito</span> <span class="tag">presto</span></div>
    </div>

    <label class="field">La tua email</label>
    <input class="text" type="email" value="${esc(S.email)}" placeholder="dove ricevere il libro"
      oninput="S.email=this.value;renderPayBtnOnly()">
    <button id="paybtn" class="btn block" ${emailValid?"":"disabled"}
      onclick="set({screen:'delivered'})">Paga ${STORY.price} (finto)</button>
    <p class="hint" style="text-align:center">Nessuna coda, nessun "il tuo libro si sta creando". È già pronto.</p>
  </div></div>`;
}

function deliveredScreen(){
  const slug=(S.protagName||"eroe").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const perma=`dreamtaily.app/libro/${STORY.id}-${slug}`;
  return `<div class="screen"><div class="panel" style="max-width:520px;margin:0 auto;text-align:center">
    <h1>Il tuo libro è pronto 🎉</h1>
    <p class="hint">link permanente</p>
    <div class="perma"><span style="flex:1">${esc(perma)}</span>
      <button class="btn ghost" style="font-family:ui-monospace,monospace;font-size:12px"
        onclick="navigator.clipboard&&navigator.clipboard.writeText('https://${perma}');set({copied:true});setTimeout(()=>set({copied:false}),1500)">
        ${S.copied?"copiato ✓":"copia"}</button></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px">
      <button class="btn primary" onclick="set({screen:'book',page:0})">Apri il libro</button>
      <button class="btn ghost" onclick="reset()">Ricomincia</button>
    </div>
  </div></div>`;
}

function reset(){ set({
  screen:"configure",
  protagonist:DT_EMBEDDED&&DT_EXTERNAL_IMAGE?DT_EXTERNAL_PROTAGONIST_ID:null,
  protagName:DT_EMBEDDED?(DT_EXTERNAL_NAME||"Il tuo personaggio"):"",
  cast:{},
  setup:{atmosfera:"tramonto"},
  branch:{},
  plan:"digital",
  page:0,
  email:"",
  copied:false
}); }

/* ------------------------------- RENDER ----------------------------------- */
function screenHTML(){
  if(S.screen==="book") return bookScreen();
  if(S.screen==="checkout") return checkoutScreen();
  if(S.screen==="delivered") return deliveredScreen();
  return configureScreen();
}
function render(){
  document.getElementById("app").innerHTML =
    `<div class="topbar"><div class="brand">DreamTaily <span class="mvp">MVP</span></div>${stepperHTML()}<button class="embed-close" type="button" onclick="closeDreamTailyConfigurator()">Chiudi</button></div>`+
    screenHTML();
}
/* lightweight partial refreshers so typing in inputs doesn't lose focus */
function updateNameDependentUI(){
  if(S.screen!=="configure") return;
  const previewStep=getPreviewStep();
  const preview=document.getElementById("live-preview-text");
  if(preview) preview.textContent=S.cast.helper
    ?resolveText(previewStep)
    :"Scegli un compagno per completare questa pagina.";
  document.querySelectorAll("[data-branch-prompt]").forEach(node=>{
    const branch=STORY.branches.find(item=>item.id===node.dataset.branchPrompt);
    if(branch) node.textContent=branch.prompt.replace("[protag]",S.protagName||"il protagonista");
  });
}
function renderPayBtnOnly(){ const b=document.getElementById("paybtn"); if(b) b.disabled=!/\S+@\S+\.\S+/.test(S.email); }


function auditStory(){
  const errors=[];
  const ids=new Set();
  for(const step of STORY.steps){
    if(ids.has(step.id)) errors.push(`step duplicato: ${step.id}`);
    ids.add(step.id);
    for(const slot of step.scene?.slots||[]){
      if(!STORY.cast.some(item=>item.role===slot.role)) errors.push(`role sconosciuto: ${step.id}/${slot.role}`);
      if(!["in_piedi","cammina","seduto","si_china","di_spalle"].includes(slot.pose)){
        errors.push(`posa sconosciuta: ${step.id}/${slot.pose}`);
      }
      for(const field of ["x","y","scale"]){
        if(typeof slot[field]!=="number"||slot[field]<0||slot[field]>1){
          errors.push(`${field} non valido: ${step.id}/${slot.role}`);
        }
      }
    }
  }
  for(const branch of STORY.branches){
    if(!branch.options?.length) errors.push(`bivio senza opzioni: ${branch.id}`);
  }
  if(errors.length){
    console.error("DreamTaily configurator audit",errors);
    document.documentElement.dataset.configError="true";
  }
  return errors;
}

auditStory();
render();
notifyDreamTailyParent();
</script>
